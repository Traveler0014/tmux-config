# ============================================================
# 40-layouts —— session 布局保存 / 恢复
# 依赖：~/.local/bin/tmux-layout （本仓库 bin/tmux-layout，install.sh 负责链接）
#
#   prefix + S   把当前 session 的「窗口/pane 结构 + 各自 cwd」存成模板
#   prefix + L   弹出模板列表，选择一个恢复成新 session
#
# 只新增这两个键位，其余键位保持 tmux 默认（与既有习惯一致）
# ============================================================

bind S command-prompt -p "保存布局为(模板名):" "run-shell 'tmux-layout save %%'"
bind L run-shell 'tmux-layout menu'
