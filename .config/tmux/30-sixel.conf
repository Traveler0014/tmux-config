# ============================================================
# 30-sixel —— 图形协议（sixel）
#
# 机制（tmux 3.5 起是「自己解析 + 自己绘制」，不是简单透传）：
#   1) tmux 会假装支持 sixel（对 pane 里的应用回 DA1 带属性 4），
#      所以应用会真的吐 sixel 给 tmux；
#   2) tmux 解析出图像后，再按「外层终端的单元格像素尺寸」缩放、重新
#      编码，输出给外层终端；
#   3) 以下任一条件不满足，tmux 就退化成文字占位符
#      "SIXEL IMAGE (12x5)" + 一串 "+"：
#        - 外层终端不支持 sixel（Sxl / TERM_SIXEL）
#        - tmux 不知道单元格像素尺寸（xpixel/ypixel 为 0）
#
# 本机（WSL2 + WezTerm）实测结论：
#   - WezTerm DA1 = ESC[?65;4;6;18;22;52c，含 4 → 支持 sixel ✅
#   - 但 WSL/ConPTY 的 pty 报 ws_xpixel=0，而 tmux < 3.6 只读 ioctl、
#     不会主动问终端像素尺寸 → 必然走占位符路径 ❌
#   - tmux >= 3.6 会发 CSI 18t / CSI 14t 询问，WezTerm 正常应答
#     (ESC[8;43;190t / ESC[4;946;1900t) → 于是能正常出图 ✅
#   自检：tmux-sixel-check（其中 client_cell_width 为 0 就是这个问题）
#
# 其它已知限制：
#   - 单张图像有 1MB 上限（tmux issue #4161），大图会被丢弃；
#   - 重绘 / 滚动 / 切 pane 后图像可能残留或错位；
#   - kitty 图形协议 tmux 不支持（只有 sixel）。
#
# 换到不支持 sixel 的终端（如 Alacritty）时，把两行 sixel 注释掉即可，
# 其它 feature 与图形无关。
# ============================================================

# 通用能力：真彩色 + 剪贴板 + 超链接 + 焦点 + 同步刷新 + 扩展键
set -as terminal-features ',xterm*:RGB:clipboard:hyperlinks:focus:sync:extkeys'
set -as terminal-features ',wezterm*:RGB:clipboard:hyperlinks:focus:sync:extkeys'

# 图形能力（单独成行，方便单独关掉）
set -as terminal-features ',xterm*:sixel'
set -as terminal-features ',wezterm*:sixel'

# 允许应用把 DCS / APC 序列透传给外层终端（图片之外的 passthrough 也靠它）
set -g allow-passthrough on
