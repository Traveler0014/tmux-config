# ============================================================
# 30-sixel —— 图形协议（sixel）
#
# tmux ≥ 3.4 支持 sixel「透传」：应用直接打印 sixel，tmux 不做解码，
# 原样转发给外层终端。所以：
#   1) 外层终端必须真的支持 sixel（WezTerm 支持）；
#   2) tmux 必须被告知外层终端支持 sixel（下面的 terminal-features）；
#   3) 应用侧要直接输出 sixel（不要自作聪明套 DCS passthrough 包装，
#      也不要因为 $TMUX 存在就降级成字符画）。
#
# 自检：在 tmux 里执行  tmux info | grep -i sixel   应看到  Sxl: (bool) true
#
# 注意（tmux 3.5 已知限制，非配置问题）：
#   - 单张图像有 1MB 上限（tmux issue #4161，大图会被静默丢弃）；
#   - 重绘 / 滚动 / 切 pane 后图像残留或错位是 tmux 侧固有行为；
#   - 只在「当前可见区域」有效，不能当图片浏览器用。
#
# 若换成不支持 sixel 的终端（如 Alacritty），把下面两行 sixel 注释掉即可，
# 其它 feature 与图形无关。
# ============================================================

# 通用能力：真彩色 + 剪贴板 + 超链接 + 焦点 + 同步刷新 + 扩展键
set -as terminal-features ',xterm*:RGB:clipboard:hyperlinks:focus:sync:extkeys'
set -as terminal-features ',wezterm*:RGB:clipboard:hyperlinks:focus:sync:extkeys'

# 图形能力（单独成行，方便单独关掉）
set -as terminal-features ',xterm*:sixel'
set -as terminal-features ',wezterm*:sixel'

# 允许应用把 DCS / APC 序列透传给外层终端（sixel、部分通知、图片协议都依赖它）
set -g allow-passthrough on
