# ============================================================
# tmux 主入口（薄壳）—— 由 ~/github/tmux-config 仓库管理
#   install.sh 会把 ~/.config/tmux 链到本仓库 .config/tmux
#   原则：本文件只负责加载顺序，具体配置写对应模块
# ============================================================

# 基础行为项（终端能力 / 历史 / 焦点 / 扩展键 / 鼠标）
source-file -q ~/.config/tmux/00-options.conf

# 图形协议（sixel 透传）
source-file -q ~/.config/tmux/30-sixel.conf

# session 布局保存 / 恢复（配套 bin/tmux-layout）
source-file -q ~/.config/tmux/40-layouts.conf

# 本机私有配置（不入库，install.sh 从 .example 生成）
source-file -q ~/.config/tmux/90-local.conf
