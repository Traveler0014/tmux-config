# ============================================================
# 00-options —— 基础行为项（与机器无关，可直接搬到新机器）
# ============================================================

# --- 终端类型 -------------------------------------------------
# 缺省是 screen-256color，会掉 truecolor / 现代能力；tmux-256color 是正解
set -g default-terminal "tmux-256color"

# --- ESC 延迟 -------------------------------------------------
# 缺省 500ms，nvim/ssh 里 ESC 会有明显滞后；10ms 足够区分组合键
set -g escape-time 10

# --- 滚动历史 -------------------------------------------------
set -g history-limit 50000

# --- 焦点事件 -------------------------------------------------
# 让 nvim 的 autoread / 自动刷新在切窗时能正常工作
set -g focus-events on

# --- 剪贴板 ---------------------------------------------------
# 复制时通过 OSC 52 直接写入系统剪贴板（WezTerm 原生支持）
set -g set-clipboard on

# --- 扩展键（迁移自旧配置，保留原行为）-----------------------
set -g extended-keys on
set -g extended-keys-format csi-u

# --- 鼠标（迁移自旧配置，保留原行为）-------------------------
# 点击切 pane、拖拽复制、滚轮翻历史
set -g mouse on


# ============================================================
# 以下为「可选增强」，默认全部注释，按需打开
# （它们会改变窗口/pane 编号习惯，所以不默认启用）
# ============================================================

# 窗口编号从 1 开始（默认 0）；注意 C-b 0 的含义会随之改变
# set -g base-index 1
# setw -g pane-base-index 1

# 关窗后自动重排编号（默认 off）
# set -g renumber-windows on

# 关闭一个 session 时不 detach 客户端，而是切到别的 session
# set -g detach-on-destroy off

# copy-mode 用 vi 键位（默认是 emacs 键位）
# setw -g mode-keys vi
